[package]
name = "glory-dump-game"
version = "0.1.0"
description = "Glory Dump PvP Token Game on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "glory_dump_game"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "~1.18.17"
spl-token = "4.0.0"
spl-associated-token-account = "3.0.2"
mpl-token-metadata = "4.1.2"
