[package]
name = "anchor-syn"
version = "0.30.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "anchor_syn"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing"] }

[features]
default = []
hash = []
