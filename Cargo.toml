[workspace]
members = [
    "crates/glory-dump-core",
    "crates/glory-dump-sim",
    "programs/glory_dump",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Jabari-Byrd/Glory-Dump"

[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
glory-dump-core = { path = "crates/glory-dump-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
